<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filament bunkers: latch it, tube in both ends</title>
<link rel="stylesheet" href="../../brand/tokens.css">
<link rel="stylesheet" href="../../templates/sign.css">
<style>
  /* the base CSS points at ../brand/; signs live one level deeper */
  .trail { background-image: url("../../brand/patterns/rainbow-trail.svg"); }
</style>
</head>
<body>
<main class="sign landscape diagram" data-family="tools">
  <header class="sign-header">
    <img class="mark" src="../../brand/logo/ctrlh-mark-rainbow.svg" alt="CTRL-H">
    <div class="kicker">Filament bunkers<small>Training required</small></div>
    <div class="accent-hex"></div>
  </header>
  <div class="trail"></div>

  <section class="sign-body">
    <h1 class="title">Latch it. Tube both ends.</h1>
    <div class="accent-rule"></div>

    <div class="compare">
      <figure class="yes">
        <figcaption class="cmp-head">
          <img src="../../brand/illustrations/led-green.svg" alt="">Right: printing
        </figcaption>
        <img class="cmp-art" src="../../brand/illustrations/bunker-printing.svg"
             alt="Bunker shut, catch clipped, PTFE tube running from the left lid fitting into a printer">
        <figcaption>Shut, tube from the left fitting to the printer.</figcaption>
      </figure>
      <figure class="yes">
        <figcaption class="cmp-head">
          <img src="../../brand/illustrations/led-green.svg" alt="">Right: storage
        </figcaption>
        <img class="cmp-art" src="../../brand/illustrations/bunker-latched.svg"
             alt="Bunker shut, catch clipped over the rim, PTFE tube looped from one lid fitting to the other">
        <figcaption>Shut, and both tube ends home.</figcaption>
      </figure>
      <figure class="no">
        <figcaption class="cmp-head">
          <img src="../../brand/illustrations/led-red.svg" alt="">Wrong
        </figcaption>
        <img class="cmp-art" src="../../brand/illustrations/bunker-open.svg"
             alt="Bunker with the lid up, the catch hanging open and one end of the tube pulled out of its lid fitting">
        <figcaption>Catch open, one tube end out.</figcaption>
      </figure>
    </div>

    <ul class="hex-list">
      <li>Filament runs through the PTFE tube</li>
      <li><b>Both</b> tube ends into fittings</li>
      <li>Lid down, catch clipped over the rim</li>
      <li>Desiccant stays in the bunker</li>
    </ul>

    <div class="check">
      <img src="../../brand/illustrations/led-amber.svg" alt="">
      <span>Training required before you print.</span>
    </div>
  </section>

  <footer class="sign-footer">
    <img class="mark" src="../../brand/logo/ctrlh-mark.svg" alt="">
    <span>PDX Hackerspace &middot; CTRL-H</span>
    <span class="right">3d-printers / bunker-storage</span>
  </footer>
</main>
</body>
</html>
