<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Server room door (outside): PULL</title>
<link rel="stylesheet" href="../../brand/tokens.css">
<link rel="stylesheet" href="../../templates/sign.css">
<style>
  /* the base CSS points at ../brand/; signs live one level deeper */
  .trail { background-image: url("../../brand/patterns/rainbow-trail.svg"); }
</style>
</head>
<body>
<main class="sign" data-family="house">
  <header class="sign-header">
    <img class="mark" src="../../brand/logo/ctrlh-mark-rainbow.svg" alt="CTRL-H">
    <div class="kicker">Server room door<small>Outside</small></div>
    <div class="accent-hex"></div>
  </header>
  <div class="trail"></div>

  <section class="sign-body">
    <h1 class="big-word">PULL</h1>
    <p class="subtitle">hard, to test the lock.</p>
    <div class="accent-rule"></div>
    <p class="lede">Turn the key counterclockwise, one extra turn, to lock it.</p>
    <div class="row-end">
      <div class="check">
        <img src="../../brand/illustrations/led-red.svg" alt="">
        <span>It opens? It was never locked.</span>
      </div>
      <div class="critter">
        <span class="bubble">LOCKED?</span>
        <img src="../../brand/illustrations/robot.svg" alt="">
      </div>
    </div>
  </section>

  <footer class="sign-footer">
    <img class="mark" src="../../brand/logo/ctrlh-mark.svg" alt="">
    <span>PDX Hackerspace &middot; CTRL-H</span>
    <span class="right">building / server-room-door</span>
  </footer>
</main>
</body>
</html>
