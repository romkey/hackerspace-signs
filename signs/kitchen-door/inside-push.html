<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen door (inside): PUSH</title>
<link rel="stylesheet" href="../../brand/tokens.css">
<link rel="stylesheet" href="../../templates/sign.css">
<style>
  /* the base CSS points at ../brand/; signs live one level deeper */
  .trail { background-image: url("../../brand/patterns/rainbow-trail.svg"); }
</style>
</head>
<body>
<main class="sign" data-family="house">
  <header class="sign-header">
    <img class="mark" src="../../brand/logo/ctrlh-mark-rainbow.svg" alt="CTRL-H">
    <div class="kicker">Kitchen door<small>Inside</small></div>
    <div class="accent-hex"></div>
  </header>
  <div class="trail"></div>

  <section class="sign-body">
    <h1 class="big-word">PUSH</h1>
    <p class="subtitle">until it clicks.</p>
    <div class="accent-rule"></div>
    <p class="lede">The closer won&rsquo;t latch it for you.</p>
    <div class="row-end">
      <div class="check">
        <img src="../../brand/illustrations/led-green.svg" alt="">
        <span>Then pull to make sure it&rsquo;s latched.</span>
      </div>
      <div class="critter">
        <span class="bubble">CLICK!</span>
        <img src="../../brand/illustrations/sasquatch.svg" alt="">
      </div>
    </div>
  </section>

  <footer class="sign-footer">
    <img class="mark" src="../../brand/logo/ctrlh-mark.svg" alt="">
    <span>PDX Hackerspace &middot; CTRL-H</span>
    <span class="right">house / kitchen-door</span>
  </footer>
</main>
</body>
</html>
