<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SIGN TITLE</title>
<!-- Paths assume this file lives in signs/<topic>/. -->
<link rel="stylesheet" href="../../brand/tokens.css">
<link rel="stylesheet" href="../../templates/sign.css">
<style>.trail { background-image: url("../../brand/patterns/rainbow-trail.svg"); }</style>
</head>
<body>
<!-- data-family: safety | tools | house | green | wayfinding | community  (DESIGN.md §4)
     add class="sign landscape" for 11x8.5 -->
<main class="sign" data-family="tools">
  <header class="sign-header">
    <img class="mark" src="../../brand/logo/ctrlh-mark-rainbow.svg" alt="CTRL-H">
    <div class="kicker">Where / what<small>Sub-kicker</small></div>
    <div class="accent-hex"></div>
  </header>
  <div class="trail"></div>

  <section class="sign-body">
    <h1 class="title">Verb-first title.</h1>
    <p class="lede">One line on why it matters.</p>
    <div class="accent-rule"></div>

    <!-- Plain points: hexagon bullets -->
    <ul class="hex-list">
      <li>First thing to do</li>
      <li>Second thing, with a value like <span class="mono">200&#8239;°C</span></li>
    </ul>

    <!-- Yes / ask / no lists: use LED bullets INSTEAD of the hex list (always pair colour with words)
    <ul class="led-list">
      <li><img src="../../brand/illustrations/led-green.svg" alt=""><span><b>Yes:</b> allowed thing</span></li>
      <li><img src="../../brand/illustrations/led-amber.svg" alt=""><span><b>Ask first:</b> conditional thing</span></li>
      <li><img src="../../brand/illustrations/led-red.svg" alt=""><span><b>Never:</b> forbidden thing</span></li>
    </ul>
    -->

    <!-- Last block + one critter, side by side. Delete the critter if it doesn't fit. -->
    <div class="row-end">
      <div class="check">
        <img src="../../brand/illustrations/led-green.svg" alt="">
        <span>The key confirming action.</span>
      </div>
      <div class="critter">
        <span class="bubble">BEEP</span>
        <img src="../../brand/illustrations/alien.svg" alt="">
      </div>
    </div>
  </section>

  <footer class="sign-footer">
    <img class="mark" src="../../brand/logo/ctrlh-mark.svg" alt="">
    <span>PDX Hackerspace &middot; CTRL-H</span>
    <span class="right">family / sign-name</span>
  </footer>
</main>
</body>
</html>
